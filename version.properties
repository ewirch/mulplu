# The version that is currently released — i.e. the one tag v<versionName>
# points at. This corrects #46's "next free numbers" convention: the release
# guard in app/build.gradle.kts demands that the tag for *this* versionName sits
# on HEAD, so these numbers describe what ships now, not what ships next.
#
# Owned by the `releaseVersion` task (root build.gradle.kts), which bumps them,
# commits, tags and pushes in one go — see docs/release.md. Edit by hand only to
# correct a version that has not been tagged yet; a tagged one is immutable.
versionCode=3
versionName=1.1
