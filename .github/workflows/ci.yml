name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Debug variant only. `build` would pull in assembleRelease, and since #46
      # packageRelease aborts without the signing key — which CI never gets,
      # because releases are built and signed locally by hand (#55).
      - name: Build and run JVM tests
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
