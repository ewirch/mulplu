<!--
  PROTOTYPE — throwaway. Answers ticket #14 "Prototype the first-run onboarding
  around calibration" (map #1). Round 1.

  Question: what does the child SEE during the first-run calibration pass?
  Mechanics are fixed by #7 (36 probes, free input, admission order, neutral
  feedback, mercy stop after 6 straight misses, probe = day-1 counting answer)
  and #6 (keypad, explicit ✓ submit). Only the framing, the neutral
  acknowledgment, the reveal, the hand-over and the resume greeting are open.

  Three structurally different variants, switchable in the floating bottom bar
  (or ← / → keys):
    A  Stiller Test      — probes on a bare screen, one thin monotone bar,
                           map appears only at the end as a reveal.
    B  Landkarte         — the progress map IS the screen from second one;
                           each probe fills its tile neutrally, the end flips
                           the tiles to their true state. Indicator = map.
    C  Etappen           — 6 rounds of 6 with a companion voice, a stamped row
                           per round, breather between rounds, explicit
                           hand-over into the day goal.

  Proto chrome (grey, not part of the design): screen jumps, and a "kann schon"
  dial that fakes how fluent the child is so the reveal / day-close can be seen
  in all three shapes.

  Not production code. Do not merge to main.
-->
<meta charset="utf-8">
<title>mulplu – Onboarding-Prototyp</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  :root {
    --bg: #EAF2F8; --card: #FFFFFF; --ink: #1E2B3A; --muted: #5B6B7C;
    --accent: #3E6FE0; --good: #2FA866; --bad: #E4574F;
    --btn-shadow: #C4D3E2; --key-bg: #D8E4F1;
    --tile-none: #D5E0EB; --tile-play: #F2C14E; --tile-done: #2FA866;
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; justify-content: center; overscroll-behavior: none;
  }
  #phone { width: 100%; max-width: 430px; height: 100dvh; display: flex;
           flex-direction: column; padding: 10px; user-select: none; }

  /* ---------- prototype chrome ---------- */
  #chrome { font-size: 11px; color: var(--muted); }
  #chrome .row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 5px; }
  #chrome button {
    border: 1px solid #C4D3E2; background: #fff; color: var(--muted);
    border-radius: 7px; padding: 3px 7px; font-size: 11px; cursor: pointer;
  }
  #chrome button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #chrome .lbl { align-self: center; font-weight: 600; }
  #switcher {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; z-index: 60;
    background: #1E2B3A; color: #fff; border-radius: 999px;
    padding: 7px 12px; box-shadow: 0 6px 18px rgba(30,43,58,.35); font-size: 12px;
  }
  #switcher button { background: #35485D; border: 0; color: #fff; border-radius: 999px;
    width: 24px; height: 24px; cursor: pointer; font-size: 13px; }
  #switcher .name { min-width: 150px; text-align: center; font-weight: 600; }
  #state { font-size: 10px; color: var(--muted); text-align: center; min-height: 12px; }

  /* ---------- shared app bits ---------- */
  #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 44px; }
  .pad { padding: 0 6px; }
  h1 { font-size: 25px; line-height: 1.2; font-weight: 800; }
  h2 { font-size: 18px; font-weight: 800; }
  p.body { font-size: 15px; color: var(--muted); line-height: 1.45; }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 16px; text-align: center; }
  .cta {
    border: 0; border-radius: 16px; background: var(--accent); color: #fff;
    font-size: 18px; font-weight: 800; padding: 15px 26px; cursor: pointer;
    box-shadow: 0 5px 0 #2A54B4;
  }
  .cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #2A54B4; }
  .ghost { background: none; border: 0; color: var(--muted); font-size: 14px;
           text-decoration: underline; cursor: pointer; }

  /* question + free input (vocabulary from #6) */
  #q { font-size: clamp(48px, 16vw, 76px); font-weight: 800; font-variant-numeric: tabular-nums; }
  #field { background: #fff; border: 3px solid var(--accent); border-radius: 14px;
    min-height: 62px; width: 62%; display: flex; align-items: center; justify-content: center;
    font-size: clamp(32px, 10vw, 44px); font-weight: 800; font-variant-numeric: tabular-nums; }
  #field.flash { border-color: var(--bad); color: var(--bad); }
  #field.ok { border-color: var(--good); color: var(--good); }
  #keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; width: 100%; }
  #keys button {
    border: 0; background: var(--key-bg); color: var(--ink); border-radius: 999px;
    aspect-ratio: 1.55; font-size: 26px; font-weight: 800; cursor: pointer;
  }
  #keys button:active { background: #C3D5E8; }
  #keys .sub { background: var(--good); color: #fff; }
  #keys .del { background: #E3EBF3; color: var(--muted); font-size: 20px; }

  /* progress map (stub of #8/#9) */
  .map { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; width: 100%; }
  .tile { aspect-ratio: 1; border-radius: 9px; background: var(--tile-none);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #7B8B9C; transition: background .35s, transform .35s; }
  .tile.probed { background: #B9C9D9; color: #566575; }
  .tile.done { background: var(--tile-done); color: #fff; }
  .tile.play { background: var(--tile-play); color: #6A4E06; }
  .tile.pop { transform: scale(1.18); }
  .tile.cur { outline: 3px solid var(--accent); outline-offset: 1px; }
  /* B while probing: the map has to share the screen with question + keypad,
     so the tiles shrink and drop their labels */
  .map.mini { grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .map.mini .tile { font-size: 0; border-radius: 5px; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); flex-wrap: wrap;
            justify-content: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; }

  /* A: thin monotone bar */
  .barwrap { height: 8px; background: #D5E0EB; border-radius: 999px; overflow: hidden; }
  .bar { height: 100%; background: var(--accent); width: 0; transition: width .35s; }

  /* C: stage rows */
  .stagehdr { display: flex; align-items: baseline; gap: 8px; }
  .stagehdr .big { font-size: 20px; font-weight: 800; }
  .stamps { display: flex; gap: 8px; justify-content: center; }
  .stamp { width: 30px; height: 30px; border-radius: 999px; background: #D5E0EB;
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-size: 16px; font-weight: 800; transition: background .3s, transform .3s; }
  .stamp.set { background: var(--accent); }
  .stamp.pop { transform: scale(1.25); }
  .dots { display: flex; gap: 4px; justify-content: center; }
  .dots span { width: 7px; height: 7px; border-radius: 999px; background: #D5E0EB; }
  .dots span.on { background: var(--accent); }
  .buddy { font-size: 40px; }
</style>

<div id="phone">
  <div id="chrome">
    <div class="row">
      <span class="lbl">Screen:</span>
      <button data-scr="intro">Intro</button>
      <button data-scr="probe">Probe</button>
      <button data-scr="mercy">Fehlserie</button>
      <button data-scr="reveal">Reveal</button>
      <button data-scr="day">Tagesende</button>
      <button data-scr="resume">Wiedereinstieg</button>
    </div>
    <div class="row">
      <span class="lbl">kann schon:</span>
      <button data-fl="0">nichts</button>
      <button data-fl="0.5">die Hälfte</button>
      <button data-fl="0.9">fast alles</button>
      <span class="lbl" style="margin-left:auto">Probe #</span>
      <button data-at="1">1</button>
      <button data-at="14">14</button>
      <button data-at="33">33</button>
    </div>
  </div>
  <div id="app"></div>
  <div id="state"></div>
</div>

<div id="switcher">
  <button id="prev">‹</button><span class="name" id="vname"></span><button id="next">›</button>
</div>

<script>
/* ---------------- fake domain state ---------------- */
// admission order, small products & shortcut families first (stand-in for the frozen list)
const ORDER = (() => {
  const p = [];
  for (let a = 2; a <= 9; a++) for (let b = a; b <= 9; b++) p.push([a, b]);
  return p.sort((x, y) => (x[0] * x[1]) - (y[0] * y[1]));
})();                                   // 36 items
const FRONT = 10;

let variant = new URLSearchParams(location.search).get('variant') || 'A';
const VARIANTS = { A: 'Stiller Test', B: 'Landkarte', C: 'Etappen' };

let S;
function reset(fluency = 0.5, upto = 0) {
  S = {
    screen: 'intro', idx: 0, fluency,
    res: ORDER.map(() => null),          // null = unprobed, true/false = probe result
    miss: 0, mercy: false, entry: '', locked: false,
  };
  for (let i = 0; i < upto; i++) { S.res[i] = Math.random() < fluency; S.idx = i + 1; }
}
reset();

const probed = () => S.res.filter(r => r !== null).length;
const known  = () => S.res.filter(r => r === true).length;

/* item state after calibration, per #7: correct -> level 5, else level 1 */
function tileState(i) {
  if (S.res[i] === true) return 'done';
  const frontIdx = ORDER.map((_, j) => j).filter(j => S.res[j] !== true).indexOf(i);
  return frontIdx > -1 && frontIdx < FRONT ? 'play' : 'none';
}

/* ---------------- render ---------------- */
const app = document.getElementById('app');
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

function render() {
  document.getElementById('vname').textContent = variant + ' — ' + VARIANTS[variant];
  document.querySelectorAll('#chrome [data-scr]').forEach(b => b.classList.toggle('on', b.dataset.scr === S.screen));
  document.querySelectorAll('#chrome [data-fl]').forEach(b => b.classList.toggle('on', +b.dataset.fl === S.fluency));
  app.innerHTML = '';
  ({ intro, probe, mercy, reveal, day, resume })[S.screen]();
  document.getElementById('state').textContent =
    `screen=${S.screen} · probed=${probed()}/36 · richtig=${known()} · Fehlserie=${S.miss}`;
}

function mapEl(mode, mini) {     // mode: 'neutral' (during calibration) | 'true'
  const m = el(`<div class="map${mini ? ' mini' : ''}"></div>`);
  ORDER.forEach(([a, b], i) => {
    const t = el(`<div class="tile">${a}·${b}</div>`);
    if (mode === 'true') t.classList.add(tileState(i));
    else if (S.res[i] !== null) t.classList.add('probed');
    if (mode === 'neutral' && i === S.idx) t.classList.add('cur');
    m.appendChild(t);
  });
  return m;
}
const legendEl = () => el(`<div class="legend">
  <span><i style="background:var(--tile-done)"></i>kannst du</span>
  <span><i style="background:var(--tile-play)"></i>üben wir</span>
  <span><i style="background:var(--tile-none)"></i>später</span></div>`);

/* ---------------- screens ---------------- */
function intro() {
  const copy = {
    A: `<h1>Zeig mal, was du schon kannst.</h1>
        <p class="body">36 Aufgaben, eine nach der anderen.<br>Kein Test, keine Note.
        Was du nicht weißt, üben wir später zusammen.</p>`,
    B: `<h1>Das ist deine Karte.</h1>
        <p class="body">36 Felder – für jede Aufgabe eins.<br>
        Wir gehen sie einmal durch, dann weiß die Karte, wo du stehst.</p>`,
    C: `<h1>Hallo! Ich bin dabei.</h1>
        <p class="body">Wir schauen zusammen, was du schon kannst –
        <b>6 Runden mit 6 Aufgaben</b>. Dauert nur ein paar Minuten.</p>`,
  }[variant];
  const c = el(`<div class="center pad">${variant === 'C' ? '<div class="buddy">🦊</div>' : ''}${copy}</div>`);
  if (variant === 'B') { const m = mapEl('neutral'); m.style.opacity = .55; c.appendChild(m); }
  c.appendChild(el(`<button class="cta">${{ A: 'Los', B: 'Karte füllen', C: 'Runde 1 starten' }[variant]}</button>`));
  c.querySelector('.cta').onclick = () => { S.screen = 'probe'; render(); };
  app.appendChild(c);
}

function probe() {
  if (S.idx >= 36) { S.screen = 'reveal'; return render(); }
  const [a, b] = ORDER[S.idx], answer = a * b;

  /* --- per-variant progress surface (this is the design question) --- */
  if (variant === 'A') {
    const top = el(`<div class="pad" style="padding-top:6px">
      <div class="barwrap"><div class="bar" style="width:${probed() / 36 * 100}%"></div></div>
      <div style="font-size:12px;color:var(--muted);text-align:right;margin-top:5px">
        ${probed()} von 36</div></div>`);
    app.appendChild(top);
  }
  if (variant === 'B') {
    const top = el('<div class="pad" style="padding-top:4px"></div>');
    top.appendChild(mapEl('neutral', true));
    app.appendChild(top);
  }
  if (variant === 'C') {
    const round = Math.floor(S.idx / 6) + 1, inRound = S.idx % 6;
    const top = el(`<div class="pad" style="padding-top:6px">
      <div class="stagehdr"><span class="big">Runde ${round}</span>
        <span style="font-size:13px;color:var(--muted)">von 6</span></div>
      <div class="stamps" style="margin-top:10px">${
        [0,1,2,3,4,5].map(k => `<div class="stamp ${k < inRound ? 'set' : ''}">✓</div>`).join('')}</div>
    </div>`);
    app.appendChild(top);
  }

  const c = el(`<div class="center pad">
    <div id="q">${a} × ${b}</div>
    <div id="field">${S.entry || '&nbsp;'}</div>
  </div>`);
  app.appendChild(c);

  const keys = el('<div class="pad"><div id="keys"></div></div>');
  const grid = keys.querySelector('#keys');
  ['1','2','3','4','5','6','7','8','9','del','0','sub'].forEach(k => {
    const btn = el(`<button class="${k === 'sub' ? 'sub' : k === 'del' ? 'del' : ''}">${
      k === 'sub' ? '✓' : k === 'del' ? '⌫' : k}</button>`);
    btn.onclick = () => key(k, answer);
    grid.appendChild(btn);
  });
  app.appendChild(keys);
}

function key(k, answer) {
  if (S.locked) return;
  if (k === 'del') { S.entry = S.entry.slice(0, -1); return render(); }
  if (k === 'sub') {
    if (!S.entry) return;
    const ok = +S.entry === answer;
    S.res[S.idx] = ok; S.miss = ok ? 0 : S.miss + 1; S.locked = true;
    ack(ok, answer);
    return;
  }
  if (S.entry.length < 2) S.entry += k;
  render();
}

/* the neutral acknowledgment — quiz-style, no right/wrong (#7) */
function ack(ok, answer) {
  const f = document.getElementById('field');
  if (variant === 'A') {                     // A: nothing but the bar moving
    f.textContent = S.entry;
    document.querySelector('.bar').style.width = ((probed()) / 36 * 100) + '%';
  }
  if (variant === 'B') {                     // B: the tile fills, neutral grey-blue
    const t = document.querySelectorAll('.tile')[S.idx];
    t.classList.add('probed', 'pop'); t.classList.remove('cur');
    setTimeout(() => t.classList.remove('pop'), 300);
  }
  if (variant === 'C') {                     // C: a stamp lands in the round's row
    const st = document.querySelectorAll('.stamp')[S.idx % 6];
    st.classList.add('set', 'pop'); setTimeout(() => st.classList.remove('pop'), 300);
  }
  setTimeout(() => {
    S.idx++; S.entry = ''; S.locked = false;
    if (S.miss >= 6) { S.mercy = true; S.screen = 'mercy'; return render(); }
    if (variant === 'C' && S.idx % 6 === 0 && S.idx < 36) return breather();
    S.screen = S.idx >= 36 ? 'reveal' : 'probe';
    render();
  }, 420);
}

function breather() {
  app.innerHTML = '';
  const round = S.idx / 6;
  app.appendChild(el(`<div class="center pad">
    <div class="buddy">🦊</div>
    <h2>Runde ${round} geschafft.</h2>
    <p class="body">Noch ${6 - round} ${6 - round === 1 ? 'Runde' : 'Runden'}. Weiter?</p>
    <div class="dots">${[1,2,3,4,5,6].map(k => `<span class="${k <= round ? 'on' : ''}"></span>`).join('')}</div>
  </div>`));
  const b = el('<div class="pad" style="display:flex;justify-content:center"><button class="cta">Weiter</button></div>');
  b.querySelector('button').onclick = () => { S.screen = 'probe'; render(); };
  app.appendChild(b);
}

/* mercy stop after 6 straight misses (#7) — the rest is seeded level 1 */
function mercy() {
  const rest = 36 - probed();
  const copy = {
    A: `<h1>Das reicht schon.</h1><p class="body">Den Rest schauen wir uns nicht einzeln an –
        wir fangen einfach zusammen an. Mit Knöpfen zum Auswählen, nicht zum Tippen.</p>`,
    B: `<h1>Genug für die Karte.</h1><p class="body">Die letzten ${rest} Felder lassen wir offen.
        Die üben wir sowieso von vorne.</p>`,
    C: `<h1>Wir hören hier auf.</h1><p class="body">Du musst nicht alles vorher zeigen.
        Ab jetzt helfe ich dir bei jeder Aufgabe.</p>`,
  }[variant];
  const c = el(`<div class="center pad">${variant === 'C' ? '<div class="buddy">🦊</div>' : ''}${copy}</div>`);
  if (variant === 'B') c.appendChild(mapEl('neutral'));
  c.appendChild(el('<button class="cta">Okay</button>'));
  c.querySelector('.cta').onclick = () => { S.screen = 'reveal'; render(); };
  app.appendChild(c);
}

/* the reveal — "schau, wie viel du schon kannst" */
function reveal() {
  const n = known();
  if (variant === 'A') {
    const c = el(`<div class="center pad">
      <h1>Du kannst schon <span style="color:var(--good)">${n}</span> von 36.</h1>
      <p class="body">Die grünen musst du nicht mehr lernen.
      Die gelben nehmen wir uns jetzt vor – zehn auf einmal, nicht mehr.</p></div>`);
    c.appendChild(mapEl('true')); c.appendChild(legendEl());
    app.appendChild(c);
  }
  if (variant === 'B') {                       // the same map the child watched, flipping
    const c = el(`<div class="center pad"><h2>Deine Karte</h2></div>`);
    const m = mapEl('neutral'); c.appendChild(m); c.appendChild(legendEl());
    app.appendChild(c);
    ORDER.forEach((_, i) => setTimeout(() => {
      const t = m.children[i];
      t.classList.remove('probed'); t.classList.add(tileState(i), 'pop');
      setTimeout(() => t.classList.remove('pop'), 250);
    }, 40 * i));
  }
  if (variant === 'C') {
    const c = el(`<div class="center pad"><div class="buddy">🦊</div>
      <h1>${n === 0 ? 'Jetzt weiß ich, wo wir anfangen.' : `${n} kannst du schon!`}</h1>
      <p class="body">Ich habe dir <b>${Math.min(FRONT, 36 - n)}</b> Aufgaben rausgelegt.
      Wenn du eine davon kannst, kommt die nächste dazu.</p></div>`);
    c.appendChild(mapEl('true'));
    app.appendChild(c);
  }
  const b = el(`<div class="pad" style="display:flex;justify-content:center;padding-top:10px">
    <button class="cta">${{ A: 'Üben', B: 'Weiter', C: 'Los geht’s' }[variant]}</button></div>`);
  b.querySelector('button').onclick = () => { S.screen = 'day'; render(); };
  app.appendChild(b);
}

/* day close — after calibration the probes ARE day 1's counting answers (#7),
   so a fluent child lands straight here; anyone else practises the front first. */
function day() {
  const done = known() >= 36;
  const goalMet = 36 - known() === 0 || S.fluency >= 0.9;
  const c = el(`<div class="center pad">
    <h2>${done ? 'Alles gefestigt!' : goalMet ? 'Für heute fertig.' : 'Heute noch dran'}</h2>
    <p class="body">${done
      ? 'Du kannst alle 36. Morgen schauen wir, ob sie sitzen.'
      : goalMet
        ? 'Alle Aufgaben von heute hast du richtig gehabt. Morgen geht es weiter.'
        : `Noch ${Math.min(FRONT, 36 - known())} Aufgaben aus deinen zehn.`}</p></div>`);
  c.appendChild(mapEl('true')); c.appendChild(legendEl());
  app.appendChild(c);
}

/* interrupted calibration, relaunch (#7: resumes at the first unprobed item) */
function resume() {
  const at = probed();
  const copy = {
    A: `<h1>Weiter, wo du warst.</h1><p class="body">${at} von 36 hast du schon gezeigt.</p>`,
    B: `<h1>Deine Karte wartet.</h1><p class="body">${36 - at} Felder sind noch offen.</p>`,
    C: `<h1>Da bist du wieder!</h1><p class="body">Wir waren bei Runde ${Math.floor(at / 6) + 1} von 6.</p>`,
  }[variant];
  const c = el(`<div class="center pad">${variant === 'C' ? '<div class="buddy">🦊</div>' : ''}${copy}</div>`);
  if (variant === 'B') c.appendChild(mapEl('neutral'));
  if (variant === 'A') c.appendChild(el(`<div class="barwrap" style="width:100%">
      <div class="bar" style="width:${at / 36 * 100}%"></div></div>`));
  c.appendChild(el('<button class="cta">Weitermachen</button>'));
  c.querySelector('.cta').onclick = () => { S.screen = 'probe'; render(); };
  app.appendChild(c);
}

/* ---------------- chrome wiring ---------------- */
document.querySelectorAll('#chrome [data-scr]').forEach(b => b.onclick = () => {
  const s = b.dataset.scr;
  if (s === 'intro') reset(S.fluency, 0);
  if (s === 'probe') { if (probed() === 0) reset(S.fluency, 0); }
  if (s === 'mercy') { reset(S.fluency, 12); S.miss = 6; for (let i = 6; i < 12; i++) S.res[i] = false; }
  if (s === 'reveal' || s === 'day') reset(S.fluency, 36);
  if (s === 'resume') reset(S.fluency, 13);
  S.screen = s; S.entry = ''; S.locked = false; render();
});
document.querySelectorAll('#chrome [data-fl]').forEach(b => b.onclick = () => {
  const scr = S.screen; reset(+b.dataset.fl, ['reveal', 'day'].includes(scr) ? 36 : scr === 'resume' ? 13 : 0);
  S.screen = scr; render();
});
document.querySelectorAll('#chrome [data-at]').forEach(b => b.onclick = () => {
  reset(S.fluency, +b.dataset.at - 1); S.screen = 'probe'; render();
});
function cycle(d) {
  const ks = Object.keys(VARIANTS);
  variant = ks[(ks.indexOf(variant) + d + ks.length) % ks.length];
  history.replaceState(null, '', '?variant=' + variant);
  S.entry = ''; S.locked = false; render();
}
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
render();
</script>
