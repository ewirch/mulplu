<!--
  PROTOTYPE — throwaway. Answers ticket #14 "Prototype the first-run onboarding
  around calibration" (map #1). Round 2, after dev feedback on round 1.

  Settled in round 1:
    - Intro, probe, mercy stop, day close and resume greeting come from variant
      C "Etappen": friendly companion, 6 rounds of 6, small bites.
    - The reveal comes from variant B "Landkarte": the map builds up tile by
      tile — but the in-play colour moves from yellow (read as "failed") to a
      neutral BLUE. Blue carries no emotional charge.
    - New requirement: the child must never be forced to answer. A
      "Weiß nicht" affordance is needed.

  Remaining ⚙ variant (bottom pill / ← →): where "Weiß nicht" lives.
    1  Eigener Knopf     — a soft button under the keypad, always visible.
    2  Im ✓-Slot         — the submit key shows "Weiß nicht" while the field is
                           empty and turns into ✓ as soon as a digit is typed.

  Mechanically "Weiß nicht" is a miss (level 1, counts toward the 6-in-a-row
  mercy stop) — but it is acknowledged exactly as neutrally as any other probe.

  Not production code. Do not merge to main.
-->
<meta charset="utf-8">
<title>mulplu – Onboarding-Prototyp (R2)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  :root {
    --bg: #EAF2F8; --card: #FFFFFF; --ink: #1E2B3A; --muted: #5B6B7C;
    --accent: #3E6FE0; --good: #2FA866; --bad: #E4574F;
    --btn-shadow: #C4D3E2; --key-bg: #D8E4F1;
    --tile-none: #D5E0EB; --tile-play: #5BA3D9; --tile-done: #2FA866;
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; justify-content: center; overscroll-behavior: none;
  }
  #phone { width: 100%; max-width: 430px; height: 100dvh; display: flex;
           flex-direction: column; padding: 10px; user-select: none; }

  /* ---------- prototype chrome ---------- */
  #chrome { font-size: 11px; color: var(--muted); }
  #chrome .row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 5px; }
  #chrome button {
    border: 1px solid #C4D3E2; background: #fff; color: var(--muted);
    border-radius: 7px; padding: 3px 7px; font-size: 11px; cursor: pointer;
  }
  #chrome button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #chrome .lbl { align-self: center; font-weight: 600; }
  #switcher {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; z-index: 60;
    background: #1E2B3A; color: #fff; border-radius: 999px;
    padding: 7px 12px; box-shadow: 0 6px 18px rgba(30,43,58,.35); font-size: 12px;
  }
  #switcher button { background: #35485D; border: 0; color: #fff; border-radius: 999px;
    width: 24px; height: 24px; cursor: pointer; font-size: 13px; }
  #switcher .name { min-width: 165px; text-align: center; font-weight: 600; }
  #state { font-size: 10px; color: var(--muted); text-align: center; min-height: 12px; }

  /* ---------- app ---------- */
  #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 44px; }
  .pad { padding: 0 6px; }
  h1 { font-size: 25px; line-height: 1.2; font-weight: 800; }
  h2 { font-size: 19px; font-weight: 800; }
  p.body { font-size: 15px; color: var(--muted); line-height: 1.45; }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 10px; text-align: center; }
  .cta {
    border: 0; border-radius: 16px; background: var(--accent); color: #fff;
    font-size: 18px; font-weight: 800; padding: 15px 26px; cursor: pointer;
    box-shadow: 0 5px 0 #2A54B4;
  }
  .cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #2A54B4; }
  .buddy { font-size: 40px; }

  /* question + free input (#6 vocabulary) */
  #q { font-size: clamp(40px, 13vw, 62px); font-weight: 800; font-variant-numeric: tabular-nums; }
  #field { background: #fff; border: 3px solid var(--accent); border-radius: 14px;
    min-height: 54px; width: 62%; display: flex; align-items: center; justify-content: center;
    font-size: clamp(32px, 10vw, 44px); font-weight: 800; font-variant-numeric: tabular-nums; }
  #keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  #keys button {
    border: 0; background: var(--key-bg); color: var(--ink); border-radius: 999px;
    aspect-ratio: 1.9; font-size: 25px; font-weight: 800; cursor: pointer;
  }
  #keys button:active { background: #C3D5E8; }
  #keys .sub { background: var(--good); color: #fff; }
  #keys .del { background: #E3EBF3; color: var(--muted); font-size: 20px; }
  /* ⚙2: same slot, but while the field is empty it is the escape hatch */
  #keys .dunno { background: #E3EBF3; color: var(--muted); font-size: 13px; font-weight: 700;
                 line-height: 1.15; }
  /* ⚙1: its own button under the keypad — deliberately quiet, never a shortcut */
  #dunnobar { display: flex; justify-content: center; padding: 8px 0 0; }
  #dunnobar button {
    border: 2px solid #C4D3E2; background: transparent; color: var(--muted);
    border-radius: 999px; padding: 9px 20px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  #dunnobar button:active { background: #DFE8F1; }

  /* progress map (stub of #8/#9) */
  .map { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; width: 100%; }
  .map.mini { grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .map.mini .tile { font-size: 0; border-radius: 5px; }
  .tile { aspect-ratio: 1; border-radius: 9px; background: var(--tile-none);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #7B8B9C; transition: background .35s, transform .35s; }
  .tile.probed { background: #B9C9D9; color: #566575; }
  .tile.done { background: var(--tile-done); color: #fff; }
  .tile.play { background: var(--tile-play); color: #fff; }
  .tile.pop { transform: scale(1.18); }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); flex-wrap: wrap;
            justify-content: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; }

  /* stage chrome (from C) */
  .stagehdr { display: flex; align-items: baseline; gap: 8px; }
  .stagehdr .big { font-size: 20px; font-weight: 800; }
  .stamps { display: flex; gap: 8px; justify-content: center; }
  .stamp { width: 30px; height: 30px; border-radius: 999px; background: #D5E0EB;
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-size: 16px; font-weight: 800; transition: background .3s, transform .3s; }
  .stamp.set { background: var(--accent); }
  .stamp.pop { transform: scale(1.25); }
  .dots { display: flex; gap: 4px; justify-content: center; }
  .dots span { width: 7px; height: 7px; border-radius: 999px; background: #D5E0EB; }
  .dots span.on { background: var(--accent); }
</style>

<div id="phone">
  <div id="chrome">
    <div class="row">
      <span class="lbl">Screen:</span>
      <button data-scr="intro">Intro</button>
      <button data-scr="probe">Probe</button>
      <button data-scr="mercy">Fehlserie</button>
      <button data-scr="reveal">Reveal</button>
      <button data-scr="day">Tagesende</button>
      <button data-scr="resume">Wiedereinstieg</button>
    </div>
    <div class="row">
      <span class="lbl">kann schon:</span>
      <button data-fl="0">nichts</button>
      <button data-fl="0.5">die Hälfte</button>
      <button data-fl="0.9">fast alles</button>
      <span class="lbl" style="margin-left:auto">Probe #</span>
      <button data-at="1">1</button>
      <button data-at="14">14</button>
      <button data-at="33">33</button>
    </div>
  </div>
  <div id="app"></div>
  <div id="state"></div>
</div>

<div id="switcher">
  <button id="prev">‹</button><span class="name" id="vname"></span><button id="next">›</button>
</div>

<script>
/* ---------------- fake domain state ---------------- */
const ORDER = (() => {                  // stand-in for the frozen admission order
  const p = [];
  for (let a = 2; a <= 9; a++) for (let b = a; b <= 9; b++) p.push([a, b]);
  return p.sort((x, y) => (x[0] * x[1]) - (y[0] * y[1]));
})();
const FRONT = 10;

/* the only thing still open: where "Weiß nicht" lives */
let variant = new URLSearchParams(location.search).get('variant') || '1';
const VARIANTS = { 1: 'Eigener Knopf', 2: 'Im ✓-Slot' };

let S;
function reset(fluency = 0.5, upto = 0) {
  S = {
    screen: 'intro', idx: 0, fluency,
    res: ORDER.map(() => null),          // null unprobed | true | false | 'dunno'
    miss: 0, entry: '', locked: false, dunnos: 0,
  };
  for (let i = 0; i < upto; i++) { S.res[i] = Math.random() < fluency; S.idx = i + 1; }
}
reset();

const probed = () => S.res.filter(r => r !== null).length;
const known  = () => S.res.filter(r => r === true).length;

function tileState(i) {                  // #7: correct -> level 5, else level 1
  if (S.res[i] === true) return 'done';
  const frontIdx = ORDER.map((_, j) => j).filter(j => S.res[j] !== true).indexOf(i);
  return frontIdx > -1 && frontIdx < FRONT ? 'play' : 'none';
}

/* ---------------- render ---------------- */
const app = document.getElementById('app');
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

function render() {
  document.getElementById('vname').textContent = '⚙' + variant + ' — ' + VARIANTS[variant];
  document.querySelectorAll('#chrome [data-scr]').forEach(b => b.classList.toggle('on', b.dataset.scr === S.screen));
  document.querySelectorAll('#chrome [data-fl]').forEach(b => b.classList.toggle('on', +b.dataset.fl === S.fluency));
  app.innerHTML = '';
  ({ intro, probe, mercy, reveal, day, resume })[S.screen]();
  document.getElementById('state').textContent =
    `${S.screen} · geprüft=${probed()}/36 · richtig=${known()} · "weiß nicht"=${S.dunnos} · Fehlserie=${S.miss}`;
}

function mapEl(mode, mini) {
  const m = el(`<div class="map${mini ? ' mini' : ''}"></div>`);
  ORDER.forEach(([a, b], i) => {
    const t = el(`<div class="tile">${a}·${b}</div>`);
    if (mode === 'true') t.classList.add(tileState(i));
    else if (S.res[i] !== null) t.classList.add('probed');
    m.appendChild(t);
  });
  return m;
}
const legendEl = () => el(`<div class="legend">
  <span><i style="background:var(--tile-done)"></i>kannst du</span>
  <span><i style="background:var(--tile-play)"></i>üben wir</span>
  <span><i style="background:var(--tile-none)"></i>später</span></div>`);

/* ---------------- screens (all from C "Etappen") ---------------- */
function intro() {
  const c = el(`<div class="center pad">
    <div class="buddy">🦊</div>
    <h1>Hallo! Ich bin dabei.</h1>
    <p class="body">Wir schauen zusammen, was du schon kannst –
      <b>6 Runden mit 6 Aufgaben</b>. Dauert nur ein paar Minuten.</p>
    <p class="body">Wenn du eine Antwort nicht weißt, ist das völlig okay –
      dann sag einfach <b>„Weiß nicht“</b>.</p>
  </div>`);
  c.appendChild(el('<button class="cta">Runde 1 starten</button>'));
  c.querySelector('.cta').onclick = () => { S.screen = 'probe'; render(); };
  app.appendChild(c);
}

function probe() {
  if (S.idx >= 36) { S.screen = 'reveal'; return render(); }
  const [a, b] = ORDER[S.idx], answer = a * b;
  const round = Math.floor(S.idx / 6) + 1, inRound = S.idx % 6;

  app.appendChild(el(`<div class="pad" style="padding-top:6px">
    <div class="stagehdr"><span class="big">Runde ${round}</span>
      <span style="font-size:13px;color:var(--muted)">von 6</span></div>
    <div class="stamps" style="margin-top:10px">${
      [0,1,2,3,4,5].map(k => `<div class="stamp ${k < inRound ? 'set' : ''}">✓</div>`).join('')}</div>
  </div>`));

  app.appendChild(el(`<div class="center pad">
    <div id="q">${a} × ${b}</div>
    <div id="field">${S.entry || '&nbsp;'}</div>
  </div>`));

  const keys = el('<div class="pad"><div id="keys"></div></div>');
  const grid = keys.querySelector('#keys');
  ['1','2','3','4','5','6','7','8','9','del','0','sub'].forEach(k => {
    let cls = '', label = k;
    if (k === 'del') { cls = 'del'; label = '⌫'; }
    if (k === 'sub') {
      // ⚙2: the same slot carries the escape hatch until a digit is typed
      const empty = variant === '2' && !S.entry;
      cls = empty ? 'dunno' : 'sub';
      label = empty ? 'Weiß<br>nicht' : '✓';
    }
    const btn = el(`<button class="${cls}">${label}</button>`);
    btn.onclick = () => (k === 'sub' && variant === '2' && !S.entry) ? dunno() : key(k, answer);
    grid.appendChild(btn);
  });
  app.appendChild(keys);

  if (variant === '1') {                 // ⚙1: its own quiet button below
    const bar = el('<div id="dunnobar" class="pad"><button>Weiß nicht</button></div>');
    bar.querySelector('button').onclick = () => dunno();
    app.appendChild(bar);
  }
}

function key(k, answer) {
  if (S.locked) return;
  if (k === 'del') { S.entry = S.entry.slice(0, -1); return render(); }
  if (k === 'sub') {
    if (!S.entry) return;
    const ok = +S.entry === answer;
    S.res[S.idx] = ok; S.miss = ok ? 0 : S.miss + 1; S.locked = true;
    ack();
    return;
  }
  if (S.entry.length < 2) S.entry += k;
  render();
}

/* "Weiß nicht" — mechanically a miss (level 1, counts toward the mercy stop),
   acknowledged exactly as neutrally as every other probe. */
function dunno() {
  if (S.locked) return;
  S.res[S.idx] = 'dunno'; S.miss++; S.dunnos++; S.locked = true;
  ack();
}

/* neutral acknowledgment (#7): a stamp lands, nothing is judged */
function ack() {
  const st = document.querySelectorAll('.stamp')[S.idx % 6];
  st.classList.add('set', 'pop'); setTimeout(() => st.classList.remove('pop'), 300);
  setTimeout(() => {
    S.idx++; S.entry = ''; S.locked = false;
    if (S.miss >= 6) { S.screen = 'mercy'; return render(); }
    if (S.idx % 6 === 0 && S.idx < 36) return breather();
    S.screen = S.idx >= 36 ? 'reveal' : 'probe';
    render();
  }, 420);
}

function breather() {
  app.innerHTML = '';
  const round = S.idx / 6;
  app.appendChild(el(`<div class="center pad">
    <div class="buddy">🦊</div>
    <h2>Runde ${round} geschafft.</h2>
    <p class="body">Noch ${6 - round} ${6 - round === 1 ? 'Runde' : 'Runden'}. Weiter?</p>
    <div class="dots">${[1,2,3,4,5,6].map(k => `<span class="${k <= round ? 'on' : ''}"></span>`).join('')}</div>
  </div>`));
  const b = el('<div class="pad" style="display:flex;justify-content:center"><button class="cta">Weiter</button></div>');
  b.querySelector('button').onclick = () => { S.screen = 'probe'; render(); };
  app.appendChild(b);
}

/* mercy stop after 6 straight misses (#7); "weiß nicht" counts */
function mercy() {
  const c = el(`<div class="center pad">
    <div class="buddy">🦊</div>
    <h1>Wir hören hier auf.</h1>
    <p class="body">Du musst nicht alles vorher zeigen.
      Ab jetzt helfe ich dir bei jeder Aufgabe.</p>
  </div>`);
  c.appendChild(el('<button class="cta">Okay</button>'));
  c.querySelector('.cta').onclick = () => { S.screen = 'reveal'; render(); };
  app.appendChild(c);
}

/* the reveal — from B: the map builds itself up, tile by tile.
   The child has not seen the map before, so this IS the introduction of it. */
function reveal() {
  const n = known();
  const c = el(`<div class="center pad">
    <div class="buddy">🦊</div>
    <h2 id="revealline">Ich baue dir deine Karte.</h2>
  </div>`);
  const m = mapEl('empty'); c.appendChild(m); c.appendChild(legendEl());
  app.appendChild(c);
  const b = el('<div class="pad" style="display:flex;justify-content:center;padding-top:10px"></div>');
  app.appendChild(b);

  ORDER.forEach((_, i) => setTimeout(() => {
    const t = m.children[i];
    t.classList.add(tileState(i), 'pop');
    setTimeout(() => t.classList.remove('pop'), 250);
  }, 45 * i));

  setTimeout(() => {
    document.getElementById('revealline').innerHTML = n === 0
      ? 'Jetzt weiß ich, wo wir anfangen.'
      : `<b>${n}</b> kannst du schon!`;
    const cta = el(`<button class="cta">Los geht’s</button>`);
    cta.onclick = () => { S.screen = 'day'; render(); };
    b.appendChild(cta);
  }, 45 * 36 + 250);
}

/* day close — the probes ARE day 1's counting answers (#7) */
function day() {
  const done = known() >= 36;
  const goalMet = done || S.fluency >= 0.9;
  const c = el(`<div class="center pad">
    <div class="buddy">🦊</div>
    <h2>${done ? 'Alles gefestigt!' : goalMet ? 'Für heute fertig.' : 'Heute noch dran'}</h2>
    <p class="body">${done
      ? 'Du kannst alle 36. Morgen schauen wir, ob sie sitzen.'
      : goalMet
        ? 'Alles von heute hattest du richtig. Morgen geht es weiter.'
        : `Noch ${Math.min(FRONT, 36 - known())} Aufgaben aus deinen blauen.`}</p></div>`);
  c.appendChild(mapEl('true')); c.appendChild(legendEl());
  app.appendChild(c);
}

/* interrupted calibration, relaunch (#7: resumes at the first unprobed item) */
function resume() {
  const at = probed();
  const c = el(`<div class="center pad">
    <div class="buddy">🦊</div>
    <h1>Da bist du wieder!</h1>
    <p class="body">Wir waren bei Runde ${Math.floor(at / 6) + 1} von 6.</p>
    <div class="dots">${[1,2,3,4,5,6].map(k =>
      `<span class="${k <= Math.floor(at / 6) ? 'on' : ''}"></span>`).join('')}</div>
  </div>`);
  c.appendChild(el('<button class="cta">Weitermachen</button>'));
  c.querySelector('.cta').onclick = () => { S.screen = 'probe'; render(); };
  app.appendChild(c);
}

/* ---------------- chrome wiring ---------------- */
document.querySelectorAll('#chrome [data-scr]').forEach(b => b.onclick = () => {
  const s = b.dataset.scr;
  if (s === 'intro' || s === 'probe') reset(S.fluency, 0);
  if (s === 'mercy') { reset(S.fluency, 12); S.miss = 6; for (let i = 6; i < 12; i++) S.res[i] = false; }
  if (s === 'reveal' || s === 'day') reset(S.fluency, 36);
  if (s === 'resume') reset(S.fluency, 13);
  S.screen = s; S.entry = ''; S.locked = false; render();
});
document.querySelectorAll('#chrome [data-fl]').forEach(b => b.onclick = () => {
  const scr = S.screen;
  reset(+b.dataset.fl, ['reveal', 'day'].includes(scr) ? 36 : scr === 'resume' ? 13 : 0);
  S.screen = scr; render();
});
document.querySelectorAll('#chrome [data-at]').forEach(b => b.onclick = () => {
  reset(S.fluency, +b.dataset.at - 1); S.screen = 'probe'; render();
});
function cycle(d) {
  const ks = Object.keys(VARIANTS);
  variant = ks[(ks.indexOf(variant) + d + ks.length) % ks.length];
  history.replaceState(null, '', '?variant=' + variant);
  S.entry = ''; S.locked = false; render();
}
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
render();
</script>
