<!--
  PROTOTYPE — throwaway. Answers ticket #6 "Design the answer-input interaction".
  Round 2, after dev feedback on round 1:
    settled: reflow button layout, explicit ✓ submit, auto-advance after wrong,
    fast tempo (wrong waits longer), sound on, no vibration, no hint text,
    wrong answer -> ALL options vanish (incl. the picked one), correct number big & centered.
  Still open, as in-page variants (⚙): the wrong-answer display for FREE INPUT.
  Not production code. Do not merge to main.
-->
<meta charset="utf-8">
<title>mulplu – Eingabe-Prototyp</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  :root {
    --bg: #EAF2F8;
    --card: #FFFFFF;
    --ink: #1E2B3A;
    --muted: #5B6B7C;
    --accent: #3E6FE0;
    --good: #2FA866;
    --bad: #E4574F;
    --btn-shadow: #C4D3E2;
    --key-bg: #D8E4F1;
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; justify-content: center;
    overscroll-behavior: none;
  }
  #phone {
    width: 100%; max-width: 430px; height: 100dvh;
    display: flex; flex-direction: column; padding: 12px;
    user-select: none;
  }

  /* ---------- prototype chrome (not part of the design) ---------- */
  #protobar {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted); margin-bottom: 6px;
  }
  #protobar .tag { background: #D9E4F0; border-radius: 6px; padding: 2px 8px; font-weight: 600; }
  #protobar button {
    margin-left: auto; border: 1px solid #C4D3E2; background: #fff; border-radius: 8px;
    padding: 4px 10px; font-size: 13px; cursor: pointer;
  }
  #levelchips { display: flex; gap: 6px; margin-bottom: 6px; }
  #levelchips button {
    flex: 1; border: 1px solid #C4D3E2; background: #fff; color: var(--muted);
    border-radius: 8px; padding: 5px 0; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  #levelchips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #state { font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px; min-height: 14px; }

  /* ---------- settings panel ---------- */
  #settings {
    position: fixed; inset: 0; background: rgba(30,43,58,.45);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
  }
  #settings.open { display: flex; }
  #settings .sheet {
    background: #fff; width: 100%; max-width: 430px; border-radius: 18px 18px 0 0;
    padding: 18px 18px 28px; max-height: 80dvh; overflow-y: auto;
  }
  #settings h2 { font-size: 15px; margin-bottom: 12px; }
  .setting { margin-bottom: 14px; }
  .setting .label { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button {
    flex: 1 1 30%; border: 1px solid #C4D3E2; background: #fff; border-radius: 8px;
    padding: 7px 4px; font-size: 12px; cursor: pointer; color: var(--muted);
  }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- the app being prototyped ---------- */
  #task {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
  }
  #question {
    font-size: clamp(56px, 18vw, 84px); font-weight: 800; letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
    transition: opacity .2s;
  }
  #answers { padding-bottom: 8px; position: relative; }

  /* multiple choice — reflow layout (settled in round 1) */
  #choices { display: grid; gap: 14px; }
  #choices.n2 { grid-template-columns: 1fr 1fr; height: 21dvh; }
  #choices.n3 { grid-template-columns: 1fr 1fr 1fr; height: 21dvh; }
  #choices.n4 { grid-template-columns: 1fr 1fr; height: 42dvh; }
  .choice {
    border: 0; border-radius: var(--radius); background: var(--card); color: var(--ink);
    font-size: clamp(30px, 9vw, 44px); font-weight: 800; font-variant-numeric: tabular-nums;
    box-shadow: 0 6px 0 var(--btn-shadow); cursor: pointer;
    transition: opacity .3s, transform .1s;
  }
  .choice:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--btn-shadow); }
  .choice.correct { background: var(--good); color: #fff; box-shadow: 0 6px 0 #22824E; }
  .choice.gone { opacity: 0; pointer-events: none; }

  /* the big centered correct answer, spanning the whole answer area */
  #bigcorrect {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    font-size: clamp(90px, 30vw, 150px); font-weight: 800;
    color: var(--good); font-variant-numeric: tabular-nums;
  }
  #bigcorrect.show { display: flex; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  #bigcorrect .eq { font-size: clamp(40px, 12vw, 64px); color: var(--ink); font-weight: 700; }
  #bigcorrect .eq b { color: var(--good); font-size: clamp(72px, 22vw, 110px); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* free input — deliberately different from the answer buttons:
     a real-looking text field + flat round keys */
  #freewrap { display: none; }
  #field {
    background: #fff; border: 3px solid var(--accent); border-radius: 14px;
    min-height: 72px; margin: 0 8vw 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(36px, 11vw, 50px); font-weight: 800;
    letter-spacing: .06em; font-variant-numeric: tabular-nums;
    box-shadow: inset 0 2px 6px rgba(30,43,58,.12);
  }
  #field .placeholder { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  #field .cursor { color: var(--accent); animation: blink 1s step-end infinite; }
  #field.bad { border-color: var(--bad); color: var(--bad); }
  #field.good { border-color: var(--good); color: var(--good); }
  @keyframes blink { 50% { opacity: 0; } }
  #keypad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    height: 38dvh; padding: 0 6vw;
  }
  .key {
    border: 0; border-radius: 50%; background: var(--key-bg); color: var(--ink);
    font-size: clamp(22px, 6.5vw, 30px); font-weight: 700;
    aspect-ratio: auto; align-self: stretch; justify-self: stretch;
    cursor: pointer; transition: transform .08s, background .15s;
  }
  .key:active { transform: scale(.92); background: #C2D4E8; }
  .key.ok { background: var(--good); color: #fff; border-radius: 26px; font-size: clamp(26px, 8vw, 36px); }
  .key.ok:active { background: #26935A; }
  .key.del { color: var(--muted); font-size: clamp(18px, 5.5vw, 26px); }

  /* sparks */
  .spark {
    position: fixed; width: 10px; height: 10px; border-radius: 50%;
    pointer-events: none; z-index: 40;
  }
  @media (prefers-reduced-motion: reduce) { .spark { display: none; } }
</style>

<div id="phone">
  <div id="protobar">
    <span class="tag">PROTOTYP · R2</span>
    <span id="protoinfo"></span>
    <button id="gear">⚙ Varianten</button>
  </div>
  <div id="levelchips"></div>

  <div id="task">
    <div id="question"></div>
  </div>

  <div id="answers">
    <div id="choices"></div>
    <div id="freewrap">
      <div id="field"></div>
      <div id="keypad"></div>
    </div>
    <div id="bigcorrect"></div>
  </div>
  <div id="state"></div>
</div>

<div id="settings"><div class="sheet">
  <h2>Prototyp-Varianten</h2>
  <div class="setting"><div class="label">Falsch-Anzeige bei freier Eingabe</div>
    <div class="seg" data-key="freeWrong">
      <button data-v="big">Nur die Zahl, groß</button>
      <button data-v="field">Korrektur im Feld</button>
      <button data-v="equation">Ganze Gleichung</button>
    </div></div>
  <div class="setting"><div class="label">Sound</div>
    <div class="seg" data-key="sound">
      <button data-v="on">An</button>
      <button data-v="off">Aus</button>
    </div></div>
  <div class="setting"><button id="closeSettings" style="width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer">Fertig</button></div>
</div></div>

<script>
'use strict';
// ------- settled in round 1 (no longer variants) -------
const T = { good: 550, wrong: 2600 };   // fast; wrong waits longer on purpose

// ------- config (the variants still under discussion) -------
const cfg = {
  freeWrong: 'big',   // big | field | equation
  sound: 'on',
};

// ------- domain: 36 items, level per item -------
const items = [];
for (let a = 2; a <= 9; a++) for (let b = a; b <= 9; b++) items.push({ a, b });

let current = null, locked = false, entry = '', level = 1;

function pickItem() {
  let it;
  do { it = items[Math.floor(Math.random() * items.length)]; }
  while (items.length > 1 && it === current);
  return it;
}
// distractors: neighbourhood products of the table, prefer shared factor, redraw each time
function distractors(it, n) {
  const correct = it.a * it.b;
  const shared = [], other = [];
  for (const j of items) {
    const p = j.a * j.b;
    if (p === correct) continue;
    (j.a === it.a || j.a === it.b || j.b === it.a || j.b === it.b ? shared : other).push(p);
  }
  const pool = [...new Set(shared)].sort((x, y) => Math.abs(x - correct) - Math.abs(y - correct)).slice(0, 8);
  const rest = [...new Set(other)].sort((x, y) => Math.abs(x - correct) - Math.abs(y - correct));
  const out = new Set();
  while (out.size < n) {
    const src = pool.length ? pool : rest;
    const idx = Math.floor(Math.random() * src.length);
    out.add(src.splice(idx, 1)[0]);
  }
  return [...out];
}

// ------- sound -------
let audioCtx;
function beep(kind) {
  if (cfg.sound !== 'on') return;
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const t = audioCtx.currentTime;
  const play = (freq, start, dur, type = 'sine', gain = .18) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, t + start);
    g.gain.exponentialRampToValueAtTime(.001, t + start + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + start); o.stop(t + start + dur);
  };
  if (kind === 'good') { play(660, 0, .12); play(880, .1, .2); }
  else { play(180, 0, .25, 'triangle', .12); }
}

// ------- sparks -------
function sparks(x, y) {
  const colors = ['#3E6FE0', '#2FA866', '#F5A623', '#E4574F', '#9B59B6'];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.background = colors[i % colors.length];
    s.style.left = x + 'px'; s.style.top = y + 'px';
    document.body.appendChild(s);
    const ang = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 90;
    s.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist - 30}px) scale(.2)`, opacity: 0 },
    ], { duration: 600 + Math.random() * 300, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => s.remove();
  }
}

// ------- rendering -------
const $ = id => document.getElementById(id);
function renderTask() {
  locked = false; entry = '';
  current = pickItem();
  const flip = Math.random() < .5;
  $('question').textContent = flip ? `${current.b} × ${current.a}` : `${current.a} × ${current.b}`;
  $('question').style.opacity = 1;
  $('bigcorrect').className = ''; $('bigcorrect').innerHTML = '';

  const free = level >= 4;
  $('freewrap').style.display = free ? 'block' : 'none';
  $('choices').style.display = free ? 'grid' : 'grid';
  $('choices').style.visibility = free ? 'hidden' : 'visible';
  if (free) { $('choices').style.display = 'none'; renderKeypad(); }
  else renderChoices();
  renderState();
}
function renderChoices() {
  const n = level + 1; // level 1→2, 2→3, 3→4 buttons
  const correct = current.a * current.b;
  const opts = [...distractors(current, n - 1), correct].sort(() => Math.random() - .5);
  const c = $('choices');
  c.className = `n${n}`;
  c.innerHTML = '';
  opts.forEach(v => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = v;
    b.onclick = e => answer(v, b, e);
    c.appendChild(b);
  });
}
function renderKeypad() {
  $('field').className = '';
  renderField();
  const kp = $('keypad'); kp.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9', 'del', '0', 'ok'].forEach(k => {
    const b = document.createElement('button');
    b.className = 'key' + (k === 'ok' ? ' ok' : k === 'del' ? ' del' : '');
    b.textContent = k === 'del' ? '⌫' : k === 'ok' ? '✓' : k;
    b.onclick = e => key(k, e);
    kp.appendChild(b);
  });
}
function renderField() {
  $('field').innerHTML = entry
    ? entry + '<span class="cursor">|</span>'
    : '<span class="placeholder">Tippe deine Antwort ein …</span>';
}
function key(k, e) {
  if (locked) return;
  if (k === 'del') { entry = entry.slice(0, -1); renderField(); return; }
  if (k === 'ok') { if (entry) answer(parseInt(entry, 10), null, e); return; }
  if (entry.length >= 2) return;
  entry += k; renderField();
}

// ------- the loop -------
function answer(v, btn, e) {
  if (locked) return; locked = true;
  const correct = current.a * current.b;
  if (v === correct) {
    beep('good');
    if (btn) {
      btn.classList.add('correct');
      const r = btn.getBoundingClientRect();
      sparks(r.left + r.width / 2, r.top + r.height / 2);
    } else {
      $('field').classList.add('good');
      const r = $('field').getBoundingClientRect();
      sparks(r.left + r.width / 2, r.top + r.height / 2);
    }
    setLevel(Math.min(5, level + 1), false);
    setTimeout(renderTask, T.good);
  } else {
    beep('wrong');
    setLevel(Math.max(1, level - 1), false);
    if (btn) wrongButtons(correct);
    else wrongFree(correct);
    setTimeout(renderTask, T.wrong);   // auto-advance, settled in round 1
  }
}

// wrong on buttons: ALL options vanish (incl. the picked one);
// only the correct number remains — big, centered, spanning the answer area.
function wrongButtons(correct) {
  [...document.querySelectorAll('.choice')].forEach(b => b.classList.add('gone'));
  setTimeout(() => {
    $('bigcorrect').textContent = correct;
    $('bigcorrect').className = 'show';
  }, 300);
}

// wrong on free input — the variants under discussion
function wrongFree(correct) {
  const f = $('field');
  if (cfg.freeWrong === 'big') {
    // everything vanishes, only the number — same feel as the button case
    $('freewrap').style.display = 'none';
    $('bigcorrect').textContent = correct;
    $('bigcorrect').className = 'show';
  } else if (cfg.freeWrong === 'field') {
    // the field itself is corrected: red flash, then the right answer in green
    f.classList.add('bad');
    setTimeout(() => {
      f.classList.remove('bad'); f.classList.add('good');
      f.innerHTML = correct;
    }, 700);
  } else {
    // the whole equation, task line included, big in the answer area
    $('question').style.opacity = 0.25;
    $('freewrap').style.display = 'none';
    $('bigcorrect').innerHTML =
      `<span class="eq">${current.a} × ${current.b} = <b>${correct}</b></span>`;
    $('bigcorrect').className = 'show';
  }
}

// ------- prototype chrome -------
function setLevel(l, rerender = true) {
  level = l;
  [...$('levelchips').children].forEach((b, i) => b.classList.toggle('on', i + 1 === l));
  if (rerender) renderTask();
}
for (let l = 1; l <= 5; l++) {
  const b = document.createElement('button');
  b.textContent = l <= 3 ? `L${l} · ${l + 1} Tasten` : l === 4 ? 'L4 · frei' : 'L5 · fest';
  b.onclick = () => setLevel(l);
  $('levelchips').appendChild(b);
}
function renderState() {
  $('state').textContent =
    `Aufgabe ${current.a}×${current.b} · Level ${level} · ` +
    `Falsch-Anzeige frei: ${{big:'nur Zahl',field:'im Feld',equation:'Gleichung'}[cfg.freeWrong]}`;
}
$('gear').onclick = () => $('settings').classList.add('open');
$('closeSettings').onclick = () => { $('settings').classList.remove('open'); renderTask(); };
document.querySelectorAll('.seg').forEach(seg => {
  const k = seg.dataset.key;
  [...seg.children].forEach(b => {
    b.classList.toggle('on', b.dataset.v === cfg[k]);
    b.onclick = () => {
      cfg[k] = b.dataset.v;
      [...seg.children].forEach(x => x.classList.toggle('on', x === b));
    };
  });
});

setLevel(1, false);
renderTask();
</script>
