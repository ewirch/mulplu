<!doctype html>
<meta charset="utf-8">
<title>PROTOTYPE — progress map (issue #10)</title>
<!--
  THROWAWAY. Layout questions for issue #10 (screen inventory / progress map).
  Round 2. Settled by round 1 and locked here, no longer switchable:
    - triangle with axes 2..9, 36 tiles, one per item
    - upper half: dashed ghost cells
    - tiles: square-ish (9px on a 40px tile = the .choice proportion from #6)
    - day open: CTA in #6's accent blue
  Palette aligned with #6 (answer input) and #14 (calibration onboarding):
    green = kannst du, #5BA3D9 = im Spiel, #D5E0EB = nicht begonnen.
  Round 3: badge = rosette (locked). "Heute befördert" is an arrow shown
  ALONGSIDE the check, and it marks any level-up today — so it also appears
  on blue (in-play) tiles, where it stands alone.
-->
<style>
  :root {
    --bg: #EAF2F8;
    --card: #FFFFFF;
    --ink: #1E2B3A;
    --muted: #5B6B7C;
    --accent: #3E6FE0;
    --btn-shadow: #C4D3E2;
    --tile-none: #D5E0EB;
    --tile-play: #5BA3D9;
    --tile-done: #2FA866;
    --tile: 42px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding-bottom: 170px;
  }
  .banner {
    width: 100%; background: #FFE9A8; color: #6B5300;
    font-size: 13px; text-align: center; padding: 6px;
  }
  .phone {
    width: 380px; margin: 18px 0; padding: 16px 14px 20px;
    background: var(--card); border-radius: 18px; box-shadow: 0 2px 18px #0002;
    position: relative; overflow: hidden;
  }

  /* ---------- header ---------- */
  .head { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; }
  .head h1 { font-size: 16px; font-weight: 600; color: var(--muted); margin: 0; }

  /* ---------- the map ---------- */
  .grid { display: grid; gap: 5px; justify-content: center; margin: 10px 0 2px; }
  .cell {
    width: var(--tile); height: var(--tile);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; position: relative;
  }
  .axis { color: var(--muted); font-weight: 600; }
  .axis.corner { color: transparent; }
  .ghost { width: var(--tile); height: var(--tile); border-radius: 9px; border: 1.5px dashed #CFDBE6; }

  .tile {
    border-radius: 9px; background: var(--tile-none); color: #fff;
    transition: background .4s, transform .35s, box-shadow .35s;
  }
  .tile.consolidated { background: var(--tile-done); }
  .tile.play { background: var(--tile-play); }
  .tile.notstarted { background: var(--tile-none); }
  /* check centred; arrow (levelled up today) pinned to the top-right corner */
  .tile .glyphs { display: flex; align-items: center; justify-content: center; line-height: 1; }
  .tile .check { font-size: 16px; }
  .tile .arrow {
    position: absolute; top: -7px; right: -7px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #F5A623; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800;
    box-shadow: 0 1px 3px #0003;
  }
  .tile.animating { transform: scale(1.18); }

  /* ---------- permanent completion badge: rosette in the header ---------- */
  .badge { display: none; align-items: center; justify-content: center; }
  body[data-badge="rosette"] .badge.rosette { display: flex; }
  .badge.rosette {
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFE9A8, #E2B23C);
    box-shadow: 0 2px 0 #B98F23; font-size: 15px;
  }
  /* ---------- chrome ---------- */
  .footer { text-align: center; margin-top: 20px; min-height: 78px; }
  .start {
    border: 0; border-radius: 22px; background: var(--accent); color: #fff;
    font-size: 20px; font-weight: 600; padding: 15px 48px; cursor: pointer;
    box-shadow: 0 6px 0 #2A51AE;
  }
  .start:active { transform: translateY(3px); box-shadow: 0 3px 0 #2A51AE; }
  .done { color: var(--muted); font-size: 17px; padding-top: 18px; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); justify-content: center; margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; }

  /* ---------- terminal overlay ---------- */
  .terminal {
    position: absolute; inset: 0; background: #FFFDF6F2;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; animation: pop .6s ease-out;
  }
  .terminal.on { display: flex; }
  .terminal .big { font-size: 78px; }
  .terminal .txt { font-size: 22px; font-weight: 700; color: var(--ink); }
  @keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
  .spark { position: absolute; width: 10px; height: 10px; border-radius: 50%; animation: fly .9s ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

  /* ---------- control bar ---------- */
  .bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #FFFFFFF2;
    border-top: 1px solid var(--btn-shadow); padding: 10px 14px; font-size: 13px;
    display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center;
  }
  .bar fieldset { border: 0; padding: 0; margin: 0; display: flex; align-items: center; gap: 6px; }
  .bar b { color: var(--muted); font-weight: 600; margin-right: 2px; }
  .bar button {
    border: 1px solid var(--btn-shadow); background: #fff; border-radius: 8px;
    padding: 4px 9px; cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 600;
  }
  .bar button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .state { width: 100%; text-align: center; color: var(--muted); font-size: 12px; }
</style>

<div class="banner">PROTOTYPE — wegwerfbar. Layoutfragen zu Issue #10 (Fortschrittskarte). Kein Produktionscode.</div>

<div class="phone" id="phone">
  <div class="head">
    <div class="badge rosette">★</div>
    <h1>Einmaleins</h1>
  </div>
  <div class="grid" id="grid"></div>
  <div class="legend">
    <span><i style="background:var(--tile-done)"></i>kannst du</span>
    <span><i style="background:var(--tile-play)"></i>üben wir</span>
    <span><i style="background:var(--tile-none)"></i>später</span>
  </div>
  <div class="footer" id="footer"></div>
  <div class="terminal" id="terminal">
    <div class="big">🏆</div>
    <div class="txt">Alle 36 geschafft!</div>
  </div>
</div>

<div class="bar">
  <fieldset><b>Abzeichen</b>
    <button data-k="badge" data-v="off">aus</button>
    <button data-k="badge" data-v="rosette">Rosette</button>
  </fieldset>
  <fieldset><b>Tag</b>
    <button data-k="day" data-v="open">offen</button>
    <button data-k="day" data-v="satisfied">erfüllt</button>
  </fieldset>
  <fieldset><b>Szenario</b>
    <button data-act="fresh">Erstlauf</button>
    <button data-act="mid">Mitten am Tag</button>
    <button data-act="late">Fast fertig</button>
    <button data-act="close">Tagesabschluss ▶</button>
    <button data-act="terminal">Terminal-Event ▶</button>
  </fieldset>
  <div class="state" id="stateline"></div>
</div>

<script>
// ---- item model: 36 unordered pairs, a<=b, factors 2..9 --------------------
const F = [2,3,4,5,6,7,8,9];
const items = [];
for (const b of F) for (const a of F) if (a <= b) items.push({ a, b, state: "notstarted", promoted: false });
const key = (a,b) => `${Math.min(a,b)}x${Math.max(a,b)}`;
const get = (a,b) => items.find(i => key(i.a,i.b) === key(a,b));

const grid = document.getElementById("grid");
function render() {
  grid.innerHTML = "";
  grid.style.gridTemplateColumns = `repeat(${F.length + 1}, var(--tile))`;
  grid.append(cell("axis corner", "·"));
  for (const c of F) grid.append(cell("axis", c));
  for (const r of F) {
    grid.append(cell("axis", r));
    for (const c of F) {
      if (c > r) {                       // upper half: mirror of an existing item
        const up = cell("upper", "");
        up.innerHTML = '<div class="ghost"></div>';
        grid.append(up);
      } else {
        const it = get(r, c);
        const el = cell(`tile ${it.state}${it.promoted ? " promoted" : ""}`, "");
        el.dataset.key = key(r, c);
        el.innerHTML = '<span class="glyphs">'
          + (it.state === "consolidated" ? '<span class="check">✓</span>' : '')
          + (it.promoted ? '<span class="arrow">↑</span>' : '')
          + '</span>';
        grid.append(el);
      }
    }
  }
  footer(); stateline();
}
function cell(cls, txt) {
  const d = document.createElement("div");
  d.className = "cell " + cls; d.textContent = txt; return d;
}
function footer() {
  document.getElementById("footer").innerHTML = document.body.dataset.day === "open"
    ? '<button class="start">Los geht\'s</button>'
    : '<div class="done">Für heute fertig</div>';
}
function stateline() {
  const n = s => items.filter(i => i.state === s).length;
  document.getElementById("stateline").textContent =
    `kannst du ${n("consolidated")} · üben wir ${n("play")} · später ${n("notstarted")} · heute ↑ ${items.filter(i => i.promoted).length}`;
}

// ---- scenarios ------------------------------------------------------------
function scenario(name) {
  items.forEach(i => { i.state = "notstarted"; i.promoted = false; });
  if (name === "fresh") {
    items.slice(0, 10).forEach(i => i.state = "play");
  } else if (name === "mid") {
    items.slice(0, 14).forEach(i => i.state = "consolidated");
    items.slice(14, 24).forEach(i => i.state = "play");
    items.slice(12, 14).forEach(i => i.promoted = true);   // consolidated today: ✓ + ↑
    items.slice(15, 18).forEach(i => i.promoted = true);   // level-up inside the front: ↑ alone
  } else if (name === "late") {
    items.forEach(i => i.state = "consolidated");
    items.slice(33).forEach(i => { i.state = "play"; i.promoted = false; });
  }
  document.getElementById("terminal").classList.remove("on");
  document.body.dataset.badge = "off"; syncButtons();
  render();
}

// ---- day close: the map animates the day's movements ----------------------
async function dayClose() {
  const moved = items.filter(i => i.promoted);
  const targets = moved.length ? moved : items.filter(i => i.state === "play").slice(0, 3);
  for (const it of targets) {
    const el = grid.querySelector(`[data-key="${key(it.a, it.b)}"]`);
    if (!el) continue;
    el.classList.add("animating"); await sleep(280);
    el.classList.remove("animating"); await sleep(130);
  }
}

// ---- terminal event: the one time the app goes big -------------------------
async function terminal() {
  items.forEach(i => { i.state = "consolidated"; i.promoted = false; });
  const last = items[items.length - 1];
  last.state = "play"; render();
  await sleep(450);
  last.state = "consolidated"; last.promoted = true; render();
  const el = grid.querySelector(`[data-key="${key(last.a, last.b)}"]`);
  el.classList.add("animating"); await sleep(420); el.classList.remove("animating");
  sparks(); await sleep(520);
  document.getElementById("terminal").classList.add("on");
  document.body.dataset.day = "satisfied"; footer();
  if (document.body.dataset.badge === "off") document.body.dataset.badge = "rosette";
  syncButtons();
}
function sparks() {
  const p = document.getElementById("phone");
  const cols = ["#3E6FE0", "#2FA866", "#E2B23C", "#5BA3D9"];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.style.background = cols[i % cols.length];
    s.style.left = "50%"; s.style.top = "45%";
    s.style.setProperty("--dx", (Math.random() * 320 - 160) + "px");
    s.style.setProperty("--dy", (Math.random() * 320 - 160) + "px");
    p.append(s); setTimeout(() => s.remove(), 900);
  }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---- controls -------------------------------------------------------------
document.querySelector(".bar").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.k) {
    document.body.dataset[b.dataset.k] = b.dataset.v;
    if (b.dataset.k === "day") footer();
    syncButtons();
  } else if (b.dataset.act === "close") dayClose();
  else if (b.dataset.act === "terminal") terminal();
  else scenario(b.dataset.act);
});
function syncButtons() {
  document.querySelectorAll(".bar button[data-k]").forEach(b => {
    b.setAttribute("aria-pressed", document.body.dataset[b.dataset.k] === b.dataset.v);
  });
}

Object.assign(document.body.dataset, { badge: "off", day: "open" });
syncButtons();
scenario("mid");
</script>
